services:
  web:
    build: .
    env_file: .env
    environment:
      - DATABASE_PATH=/app/data/db.sqlite3
    volumes:
      - db_data:/app/data
      - media_data:/app/media
      - static_data:/app/staticfiles
    restart: unless-stopped

  nginx:
    build: ./frontend
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db_data:
  media_data:
  static_data:
